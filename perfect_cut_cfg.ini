[screen]
title_name = Perfect Stop
panel_name = Stop Control (Inches Only)
panel_color = #006380

[myvars]
dir_x = 18   # Direction GPIO Pin for Fence
step_x = 23  # Step GPIO Pin
max_x = 40   #this is the dimension that should be displayed when the fence is on the max limit sensor
min_x = 0    #this is the dimension that should be displayed when the fence is on the min limit sensor
home_x = 30  # this is the final resting location when homing is complete
home_xmax = 150 # this is a large number to make sure axis hits max limit switch during homing
cw_x = 0     # Clockwise Rotation
ccw_x = 1    # Counterclockwise Rotation
low_limit_x = 20 #GPIO Pin
high_limit_x = 21 # fence end of travel right side of blade
steps_per_revolution_x = 1000 #match switch settings on stepper controller
desired_rotations_per_second = 20 # this is approx - higher number = faster speed - caution too high and will loose steps
stp_per_inch_x = 1000 #calabration setting

[presets]
shortcut_e1 = 3.0
shortcut_e2 = 56.2
shortcut_e3 = 17.125
shortcut_e4 = -1.0

